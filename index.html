<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CafeFinder — поиск заведений</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--bd:#262c36;--tx:#e8ebf0;--mu:#8b94a3;--ac:#f5a524;--g:#22c55e;--b:#3b82f6;--y:#eab308}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0e1116ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding:12px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}h1{margin:0;font-size:20px}h1 span{color:var(--ac)}
input,select,button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font:inherit}
input[type=search]{flex:1;min-width:140px}button{cursor:pointer;transition:.15s}button:hover{border-color:var(--ac);transform:translateY(-1px)}button:disabled{opacity:.5;cursor:wait}
.pri{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}.chip{padding:5px 11px;font-size:13px;border-radius:99px}.chip.on{background:var(--ac);color:#111;border-color:var(--ac)}
label{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--mu)}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;animation:in .3s both;display:flex;flex-direction:column;gap:7px}
.card.no{border-color:#22c55e66;box-shadow:0 0 18px #22c55e18}.card.done{opacity:.58}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.t{display:flex;justify-content:space-between;gap:8px;font-weight:650;font-size:16px}.mu{color:var(--mu);font-size:13px}.badge{font-size:12px;border-radius:6px;padding:2px 7px;background:var(--ac);color:#111;font-weight:700}
.st{font-size:13px;font-weight:650}.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.acts button,.acts a{font-size:12px;padding:5px 9px;border-radius:8px;border:1px solid var(--bd);color:var(--tx);text-decoration:none;background:transparent}
a{color:var(--b)}#msg{padding:8px 16px;color:var(--mu);font-size:13px}.note{padding:0 16px 12px;color:var(--mu);font-size:12px}
</style>
</head>
<body>
<header>
 <div class="row" style="margin:0"><h1>☕ Cafe<span>Finder</span></h1><b id="cnt" class="mu"></b><button class="pri" id="go" style="margin-left:auto">🔍 Найти новые заведения</button></div>
 <div class="row"><input type="search" id="q" placeholder="Поиск по названию, адресу, телефону…"><select id="sort"><option value="new">Сначала новые</option><option value="name">По названию</option></select></div>
 <div class="row" id="cats"></div><div class="row" id="cities"></div>
 <div class="row"><input id="cc" placeholder="Добавить город" style="width:150px"><button id="add">+ город</button>
 <label><input type="checkbox" id="fNo">Только без сайта</label><label><input type="checkbox" id="fPh">Только с телефоном</label>
 <label><input type="checkbox" id="fFav">Избранное</label><label><input type="checkbox" id="fNew">Только новые</label><button id="csv">⬇ CSV</button></div>
</header>
<div id="msg">Готов к поиску. Выберите город или включите «Вся Россия».</div>
<div class="note">Данные поступают из OpenStreetMap. Отсутствие сайта в базе не доказывает, что у заведения нет сайта — проверяйте вручную.</div>
<main id="list"></main>
<script>
const CATS={all:'Все',coffee:'☕ Кофейни',sushi:'🍣 Суши-бары',restaurant:'🍽️ Рестораны',pastry:'🎂 Кондитерские',pizza:'🍕 Пиццерии',burger:'🍔 Бургерные',bakery:'🥐 Пекарни',steak:'🥩 Стейк-хаусы',cafe:'🍱 Кафе',asian:'🍜 Азиатская кухня'};
const TOP=['Москва','Санкт-Петербург','Новосибирск','Екатеринбург','Казань','Нижний Новгород','Челябинск','Самара','Омск','Ростов-на-Дону','Уфа','Красноярск','Воронеж','Пермь','Волгоград','Краснодар'];
const $=id=>document.getElementById(id),LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let db=LS('cf_db',{}),st=LS('cf_st',{cat:'all',cities:['Москва'],cl:TOP.slice(),russia:false,last:null}),busy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function chips(){
 $('cats').innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="chip ${st.cat===k?'on':''}" data-c="${k}">${v}</button>`).join('');
 $('cities').innerHTML=`<button class="chip ${st.russia?'on':''}" data-r="1">🇷🇺 Вся Россия (16 крупных городов)</button>`+st.cl.map(c=>`<button class="chip ${!st.russia&&st.cities.includes(c)?'on':''}" data-t="${esc(c)}">${esc(c)}</button>`).join('');
}
$('cats').onclick=e=>{let c=e.target.dataset.c;if(c){st.cat=c;SV('cf_st',st);chips();render()}};
$('cities').onclick=e=>{let d=e.target.dataset;if(d.r)st.russia=!st.russia;else if(d.t){let i=st.cities.indexOf(d.t);i<0?st.cities.push(d.t):st.cities.splice(i,1);st.russia=false}SV('cf_st',st);chips()};
$('add').onclick=()=>{let v=$('cc').value.trim();if(!v)return;if(!st.cl.includes(v))st.cl.push(v);if(!st.cities.includes(v))st.cities.push(v);st.russia=false;$('cc').value='';SV('cf_st',st);chips()};
const msg=t=>$('msg').textContent=t;
async function check(it){
 if(!it.website){it.status='unknown';return}
 try{let r=await fetch('/api/check?url='+encodeURIComponent(it.website));let j=await r.json();it.status=j.ok?'site':'unknown';it.checkCode=j.code||null}
 catch{it.status='unknown'}
}
async function search(){
 if(busy)return;busy=true;$('go').disabled=true;let cities=st.russia?TOP:st.cities;
 if(!cities.length){msg('Выберите хотя бы один город.');busy=false;$('go').disabled=false;return}
 let runId=Date.now(),added=0,errs=[];
 for(let n=0;n<cities.length;n++){
  msg(`Ищу заведения: ${cities[n]} (${n+1}/${cities.length})…`);
  try{
   let r=await fetch(`/api/search?city=${encodeURIComponent(cities[n])}&cats=${encodeURIComponent(st.cat)}`);
   let j=await r.json();if(!r.ok)throw Error(j.error||r.status);
   let fresh=[];
   for(let it of j.items||[]){let old=db[it.id];
    if(old){Object.assign(old,{phone:it.phone||old.phone,website:it.website||old.website,address:it.address||old.address});}
    else{db[it.id]={...it,firstSeen:runId,isNew:true,fav:false,done:false,status:it.website?'pending':'unknown'};fresh.push(db[it.id]);added++}
   }
   SV('cf_db',db);render();
   for(let it of fresh){await check(it)}
   SV('cf_db',db);render();
  }catch(e){errs.push(`${cities[n]}: ${e.message}`)}
 }
 st.last=Date.now();SV('cf_st',st);msg(`Поиск завершён · новых заведений: ${added}`+(errs.length?` · ошибки: ${errs.join('; ')}`:''));busy=false;$('go').disabled=false;render();
}
const SL={unknown:['🟡 Сайт не подтверждён / данных недостаточно','var(--y)'],site:['🔵 Сайт отвечает','var(--b)'],pending:['🟡 Проверяется…','var(--y)']};
function view(){
 let q=$('q').value.toLowerCase();
 let a=Object.values(db).filter(i=>(st.cat==='all'||i.category===st.cat)&&(!$('fNo').checked||!i.website)&&(!$('fPh').checked||i.phone)&&(!$('fFav').checked||i.fav)&&(!$('fNew').checked||i.isNew)&&(!q||[i.name,i.address,i.phone,i.city].join(' ').toLowerCase().includes(q)));
 a.sort($('sort').value==='name'?(x,y)=>x.name.localeCompare(y.name,'ru'):(x,y)=>(!x.website)-(!y.website)||y.firstSeen-x.firstSeen);return a;
}
function render(){
 let a=view();$('cnt').textContent=`Показано: ${a.length} · в базе: ${Object.keys(db).length}`;
 $('list').innerHTML=a.slice(0,300).map(i=>{let s=SL[i.status]||SL.unknown;
 let website=i.website?(/^https?:\/\//i.test(i.website)?i.website:'https://'+i.website):'';
 return `<div class="card ${!i.website?'no':''} ${i.done?'done':''}"><div class="t"><span>${esc(i.name)}</span>${i.isNew?'<span class="badge">NEW</span>':''}</div>
 <div class="mu">${esc(CATS[i.category]||i.category||'')} · ${esc(i.city)}${i.address?', '+esc(i.address):''}</div>
 <div>📞 ${i.phone?esc(i.phone):'<span class="mu">нет в базе</span>'}</div>
 <div class="st" style="color:${s[1]}">${s[0]}</div>
 ${website?`<div class="mu">🌐 <a href="${esc(website)}" target="_blank" rel="noopener noreferrer">${esc(i.website)}</a></div>`:`<div class="mu">Сайт не указан в OSM · <a target="_blank" rel="noopener noreferrer" href="https://yandex.ru/search/?text=${encodeURIComponent(i.name+' '+i.city+' официальный сайт')}">проверить поиском</a></div>`}
 <div class="mu">Источник: ${esc(i.source)} · добавлено ${new Date(i.firstSeen).toLocaleDateString('ru')}</div>
 <div class="acts"><a target="_blank" rel="noopener noreferrer" href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(i.lat)}&mlon=${encodeURIComponent(i.lon)}#map=18/${encodeURIComponent(i.lat)}/${encodeURIComponent(i.lon)}">📍 Карта</a>
 ${i.phone?`<button data-a="ph" data-id="${esc(i.id)}">📋 Телефон</button>`:''}<button data-a="nm" data-id="${esc(i.id)}">📋 Название</button>
 <button data-a="fav" data-id="${esc(i.id)}">${i.fav?'★':'☆'} Избранное</button><button data-a="done" data-id="${esc(i.id)}">${i.done?'↩ Вернуть':'✅ Уже связался'}</button></div></div>`}).join('')||'<p class="mu">Ничего не найдено. Нажмите «Найти новые заведения».</p>';
}
$('list').onclick=async e=>{let b=e.target.closest('button[data-a]');if(!b)return;let i=db[b.dataset.id],a=b.dataset.a;if(!i)return;
 if(a==='ph'||a==='nm'){try{await navigator.clipboard.writeText(a==='ph'?i.phone:i.name);msg('Скопировано.')}catch{msg('Не удалось скопировать автоматически.')}}
 if(a==='fav')i.fav=!i.fav;if(a==='done')i.done=!i.done;SV('cf_db',db);render()};
$('csv').onclick=()=>{let rows=[['Название','Категория','Телефон','Город','Адрес','Сайт','Статус','Источник','Связались']];
 view().forEach(i=>rows.push([i.name,CATS[i.category]||i.category,i.phone,i.city,i.address,i.website,SL[i.status]?.[0]||'Неизвестно',i.source,i.done?'да':'']));
 let t=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
 let l=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));l.href=u;l.download='cafefinder.csv';l.click();URL.revokeObjectURL(u)};
['q','sort','fNo','fPh','fFav','fNew'].forEach(k=>$(k).addEventListener('input',render));
$('go').onclick=search;chips();render();search();setInterval(()=>{if(!document.hidden)search()},30*60*1000);
</script>
</body></html>
